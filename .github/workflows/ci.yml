name: Workflow for CI
on: [ push, pull_request ]

permissions: read-all

# GOTOOLCHAIN=local stops Go from downloading a toolchain newer than the one
# setup-go installed. Without it the pinned versions below are advisory.
env:
  GOTOOLCHAIN: local

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go from go.mod
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version-file: go.mod

      - name: Ensure the Go module is nice and tidy
        run: |
          make tidy && git diff --exit-code go.mod go.sum
        # We set the shell explicitly, here, and in other golang test actions,
        # as by default multi-line shell scripts do not error out on the first
        # failed command. Since we want an error reported if any of the lines
        # fail, we set the shell explicitly:
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions?ref=cloudtechsimplified.com#exit-codes-and-error-action-preference
        shell: bash

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared floor from go.mod, then the current Go release. Bump
        # the upper version when Go publishes a new release.
        go-version: [ '1.26', '1.27' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify Go Modules Setup
        run: go mod verify
        shell: bash

      - name: Build
        run: make build
        shell: bash

      - name: Test
        run: make test
        shell: bash

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: '1.27'

      - name: Lint
        run: make lint
        shell: bash

      - name: Check formatting
        run: make check-fmt
        shell: bash

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: '1.27'

      - name: Coverage
        run: make coverage
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673 # v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: maguro/gslog
          flags: smart-tests
          verbose: true
